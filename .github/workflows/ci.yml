name: CI

# This workflow validates the existing KLIONS workspace without modifying source code.
# Compilation and tests are the release-safety gates; formatting is intentionally
# not a blocking gate because the current tree has pre-existing rustfmt drift.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Use the repository source exactly as committed for reproducible validation.
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      # Validate every workspace member and target using the workspace declaration.
      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

      # Run the complete workspace test suite documented by the project.
      - name: Run workspace tests
        run: cargo test --workspace --all-features

      # Keep formatting visible without making a historical formatting-only issue
      # block otherwise valid builds and tests.
      - name: Report formatting status
        shell: bash
        run: |
          if cargo fmt --all -- --check; then
            echo "Formatting check passed."
          else
            echo "::warning::cargo fmt reports formatting differences in the existing tree."
          fi
