name: CI

# This workflow validates the KLIONS workspace across compilation, tests, healthcheck, and containerization.
on:
  push:
    branches: [master, prod-hardening]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Healthcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Run workspace tests
        run: cargo test --workspace --all-features

      - name: Verify compiler self-diagnostic health check
        run: cargo run -p klions-cli -- health

      - name: Report formatting status
        shell: bash
        run: |
          if cargo fmt --all -- --check; then
            echo "Formatting check passed."
          else
            echo "::warning::cargo fmt reports formatting differences in the existing tree."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: klions:test

      - name: Run container health check and version smoke test
        run: |
          docker run --rm klions:test health
          docker run --rm klions:test version
