[package]
name = "klions-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Language server for KLIONS"
repository = "https://github.com/Kanak234/klions"
readme = "../../README.md"
keywords = ["klions", "compiler", "tensor", "machine-learning", "language"]
categories = ["compilers"]
authors.workspace = true

[[bin]]
name = "klions-lsp"
path = "src/main.rs"

[dependencies]
klions-diagnostics = { path = "../klions-diagnostics" }
klions-frontend = { path = "../klions-frontend" }
klions-types = { path = "../klions-types" }
klions-ast = { path = "../klions-ast" }
klions-lexer = { path = "../klions-lexer" }
