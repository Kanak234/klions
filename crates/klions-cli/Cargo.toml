[package]
name = "klions-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The klions command-line compiler for KLIONS, an AI-first systems language where tensor shapes are part of the type"
repository = "https://github.com/Kanak234/klions"
readme = "../../README.md"
keywords = ["klions", "compiler", "tensor", "machine-learning", "language"]
categories = ["compilers"]
authors.workspace = true

[[bin]]
name = "klions"
path = "src/main.rs"

[dependencies]
klions-diagnostics = { path = "../klions-diagnostics" }
klions-frontend = { path = "../klions-frontend" }
klions-runtime = { path = "../klions-runtime" }
klions-platform = { path = "../klions-platform" }
klions-tensor = { path = "../klions-tensor" }
klions-lexer = { path = "../klions-lexer" }
